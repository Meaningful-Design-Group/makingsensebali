name: meshtastic-fetch

# Puts the pinned Meshtastic release on the flash page (https://makingsense.fablabbali.com/flash/). Runs when the
# pin in flash/firmware/VERSIONS changes, or by hand. tools/fetch_meshtastic.sh does the work: two release zips,
# five files, each checked against the md5 in the release's own manifest, then committed so GitHub Pages serves them
# from this origin. The binaries are never edited by hand and never come from anywhere but the release.

on:
  push:
    branches: [main]
    paths:
      - "flash/firmware/VERSIONS"
      - "tools/fetch_meshtastic.sh"
      - ".github/workflows/meshtastic-fetch.yml"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: meshtastic-fetch
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: fetch the pinned release
        run: |
          set -euo pipefail
          VER="$(sed -n 's/^meshtastic=//p' flash/firmware/VERSIONS)"; [ -n "$VER" ] || { echo "no meshtastic= line in flash/firmware/VERSIONS"; exit 1; }
          bash tools/fetch_meshtastic.sh "$VER"
      - name: commit
        run: |
          set -euo pipefail
          git config user.name "meshtastic-fetch"; git config user.email "meshtastic-fetch@users.noreply.github.com"
          git add flash/firmware
          git diff --cached --quiet && { echo "already current"; exit 0; }
          git commit -m "flash: Meshtastic $(sed -n 's/^meshtastic=//p' flash/firmware/VERSIONS) from the release, md5-checked [skip ci]"
          git pull --rebase origin main
          git push origin HEAD:main
