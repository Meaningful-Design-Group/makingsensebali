name: firmware-build

# Compiles the DIY node firmware for both boards and publishes the images the flash page serves
# (https://makingsense.fablabbali.com/flash/). Runs when the firmware changes or by hand.
#
# Output, committed to the repo so GitHub Pages serves it from the same origin (the flasher fetches the
# images with fetch(); a cross-origin host would need CORS headers GitHub releases do not send):
#   flash/firmware/diy-node/manifest.json          the ESP Web Tools manifest, one build per chip
#   flash/firmware/diy-node/<ver>/<chip>/*.bin      bootloader, partitions, boot_app0, app (four parts, no padded merged image)
#   flash/firmware/diy-node/<ver>/SHA256SUMS
#
# Board options are the ones hardware/diy-node/firmware/README.md tells the IDE user to set: USB CDC on boot ENABLED for
# both boards (or Serial is silent; the option's value names differ per board, see the build step); the min_spiffs partition scheme on the C3, where a 1.35 MB app no longer fits the
# default 1.25 MB slot. The core version is pinned in flash/firmware/VERSIONS. Library versions are pinned here and
# recorded in the manifest, so a build is reproducible from its manifest alone.
#
# First run, 16 Oct 2026: core, libraries and both FQBNs resolved; the compile failed on WiFiManager 2.0.17 lacking
# two methods v5 uses (fixed below with a pinned master commit). If a later run fails on an FQBN option, print the
# list with `arduino-cli board details -b esp32:esp32:XIAO_ESP32S3`. Second run: green, both boards (S3 app
# 1.23 MB of 3.3, C3 app 1.36 MB of 1.9 with min_spiffs); the core's merged.bin was flash-sized padding, dropped.
#
# Self-update (24 Oct 2026): nodes read manifest.json once a day and install the app.bin for their chip when the
# manifest's "version" is not the build they run. Each build is stamped with that same tag (-DFW_BUILD_TAG=$TAG) and
# the step below refuses to publish an image that does not carry it: a node that cannot recognise its own build would
# reinstall it every day. Merging to main therefore updates the fleet; test on a board before merging.

on:
  push:
    branches: [main]
    paths:
      - "hardware/diy-node/firmware/diy_node_v5/**"
      - "hardware/diy-node/firmware/test/**"
      - ".github/workflows/firmware-build.yml"
      - "flash/firmware/VERSIONS"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: firmware-build
  cancel-in-progress: false

env:
  SKETCH: hardware/diy-node/firmware/diy_node_v5
  OUT: flash/firmware/diy-node
  # pinned libraries (hardware/diy-node/README.md lists them; versions chosen 16 Oct 2026, bump deliberately).
  # WiFiManager is NOT the 2.0.17 release: v5 calls setCustomBodyHeader/Footer, which exist only on tzapu's master
  # (added 12 Dec 2024, no tag since). The first CI run found this; the IDE's Library Manager 2.0.17 cannot build v5
  # either. Pinned to a master commit so the build cannot drift; bump the sha when tzapu tags a release that has them.
  LIBS: "PubSubClient@2.8;ArduinoJson@7.4.2;Adafruit BME680 Library@2.0.5;Adafruit Unified Sensor@1.1.15"
  WIFIMANAGER_GIT: "https://github.com/tzapu/WiFiManager.git#4131fe617d01d746677e8b909379597162c2ca58"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: decoder checks
        run: |
          c++ -std=c++17 -Wall -Wextra -o "$RUNNER_TEMP/decoders_test" hardware/diy-node/firmware/test/decoders_test.cpp
          "$RUNNER_TEMP/decoders_test"

      - name: arduino-cli
        uses: arduino/setup-arduino-cli@v2

      - name: core and libraries
        run: |
          set -euo pipefail
          CORE="$(sed -n 's/^esp32-core=//p' flash/firmware/VERSIONS)"; [ -n "$CORE" ] || { echo "no esp32-core= in flash/firmware/VERSIONS"; exit 1; }
          arduino-cli config init --overwrite --additional-urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install "esp32:esp32@$CORE"
          arduino-cli lib update-index
          # semicolon-separated because two of the names contain spaces
          echo "$LIBS" | tr ';' '\n' | while read -r lib; do arduino-cli lib install "$lib"; done
          arduino-cli config set library.enable_unsafe_install true
          arduino-cli lib install --git-url "$WIFIMANAGER_GIT"
          arduino-cli lib list
          echo "CORE=$CORE" >> "$GITHUB_ENV"

      - name: compile both boards
        run: |
          set -euo pipefail
          VER="$(sed -n 's/^const char\*\s*FW_VERSION\s*=\s*"\([^"]*\)".*/\1/p' "$SKETCH/diy_node_v5.ino")"; [ -n "$VER" ] || VER=v5
          SHA="$(git rev-parse --short HEAD)"; TAG="$VER-$SHA"
          echo "TAG=$TAG" >> "$GITHUB_ENV"
          # one build in the tree at a time: the page serves the manifest's tag and nothing else, and every build
          # left behind is 2.6 MB of git history nobody reads
          find "$OUT" -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +
          build() { # <chip dir> <fqbn>
            local chip="$1" fqbn="$2" bp="$RUNNER_TEMP/build-$1"
            arduino-cli compile --fqbn "$fqbn" --build-path "$bp" --warnings default \
              --build-property "compiler.cpp.extra_flags=-DFW_BUILD_TAG=$TAG" "$SKETCH"
            grep -qaxF "$TAG" <(strings "$bp"/diy_node_v5.ino.bin) || { echo "$chip image does not carry $TAG"; exit 1; }
            mkdir -p "$OUT/$TAG/$chip"
            cp "$bp"/diy_node_v5.ino.bin "$OUT/$TAG/$chip/app.bin"
            cp "$bp"/diy_node_v5.ino.bootloader.bin "$OUT/$TAG/$chip/bootloader.bin"
            cp "$bp"/diy_node_v5.ino.partitions.bin "$OUT/$TAG/$chip/partitions.bin"
            cp "$(arduino-cli config get directories.data)"/packages/esp32/hardware/esp32/"$CORE"/tools/partitions/boot_app0.bin "$OUT/$TAG/$chip/boot_app0.bin"
            # no merged.bin: the core pads it to the whole flash (8 MB on the S3, 4 MB on the C3) for a 1.3 MB app.
            # The four parts at their offsets are what esptool would write anyway, and a quarter of the download.
            ls -la "$OUT/$TAG/$chip"
          }
          # XIAO_ESP32S3's menu is the inverse of the C3's: there `cdc` means DISABLED (default = Enabled). Until 17 Oct
          # this line said CDCOnBoot=cdc, and every XIAO flashed from the page sent its log to the pins: the ROM's boot
          # text reached USB, then silence. hwcdc puts Serial on the same hardware USB port the ROM uses (303a:1001),
          # so a reset never re-enumerates the port and no host has to raise DTR before the board speaks.
          build esp32s3 "esp32:esp32:XIAO_ESP32S3:USBMode=hwcdc,CDCOnBoot=default"
          build esp32c3 "esp32:esp32:esp32c3:CDCOnBoot=cdc,PartitionScheme=min_spiffs"

      - name: manifest and checksums
        run: |
          set -euo pipefail
          python3 - "$OUT" "$TAG" "$CORE" "$LIBS;WiFiManager@git:$WIFIMANAGER_GIT" <<'EOF'
          import json, os, sys, datetime
          out, tag, core, libs = sys.argv[1:5]
          def parts(chip):
              # S3 and C3 both boot from 0x0 (the classic ESP32 boots from 0x1000)
              return [{"path": f"{tag}/{chip}/bootloader.bin", "offset": 0x0}, {"path": f"{tag}/{chip}/partitions.bin", "offset": 0x8000},
                      {"path": f"{tag}/{chip}/boot_app0.bin", "offset": 0xE000}, {"path": f"{tag}/{chip}/app.bin", "offset": 0x10000}]
          m = {"name": "Making Sense Bali · DIY node", "version": tag, "built": datetime.datetime.now(datetime.timezone.utc).isoformat(timespec="seconds"),
               "core": f"esp32:esp32@{core}", "libs": libs, "new_install_prompt_erase": False,
               "builds": [{"chipFamily": "ESP32-S3", "parts": parts("esp32s3")}, {"chipFamily": "ESP32-C3", "parts": parts("esp32c3")}]}
          json.dump(m, open(f"{out}/manifest.json", "w"), indent=2)
          print(json.dumps(m, indent=1))
          EOF
          ( cd "$OUT/$TAG" && find . -name '*.bin' | sort | xargs sha256sum > SHA256SUMS )

      - name: commit
        run: |
          set -euo pipefail
          git config user.name "firmware-build"; git config user.email "firmware-build@users.noreply.github.com"
          git add "$OUT"
          git diff --cached --quiet && { echo "nothing changed"; exit 0; }
          git commit -m "flash: DIY node $TAG for XIAO ESP32-S3 and ESP32-C3 [skip ci]"
          # the data-sync workflow commits to the same branch every quarter hour; rebase on whatever landed meanwhile
          git pull --rebase origin main
          git push origin HEAD:main
