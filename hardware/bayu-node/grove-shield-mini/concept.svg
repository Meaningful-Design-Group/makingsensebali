<line x1="620" y1="452" x2="1088" y2="452" stroke="#5b6475"/>
<text x="854.0" y="470" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="middle">39 mm</text>
<line x1="1106" y1="130" x2="1106" y2="430" stroke="#5b6475"/>
<text x="1114" y="284.0" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="start">25</text>
<rect x="644" y="170" width="180" height="174" rx="6" fill="#c7cede" stroke="#9aa3b5"/>
<text x="734.0" y="240" font-size="16" fill="#1d2433" font-weight="bold" text-anchor="middle">microSD</text>
<text x="734.0" y="260" font-size="12" fill="#1d2433" font-weight="normal" text-anchor="middle">SPI D8–D10</text>
<text x="734.0" y="276" font-size="12" fill="#1d2433" font-weight="normal" text-anchor="middle">CS on D1</text>
<circle cx="950" cy="248" r="78.0" fill="#c7cede" stroke="#9aa3b5"/>
<text x="950" y="242" font-size="15" fill="#1d2433" font-weight="bold" text-anchor="middle">CR1220</text>
<text x="950" y="262" font-size="12" fill="#1d2433" font-weight="normal" text-anchor="middle">RTC backup</text>
<rect x="870" y="352" width="40" height="40" rx="4" fill="#3b4a6a" stroke="#9aa3b5"/>
<text x="920" y="370" font-size="12" fill="#e9ecf2" font-weight="bold" text-anchor="start">PCF8563 RTC</text>
<text x="920" y="386" font-size="12" fill="#c7cede" font-weight="normal" text-anchor="start">I2C 0x51</text>
<rect x="644" y="362" width="34" height="16" rx="3" fill="#fbeed6"/>
<rect x="684" y="362" width="34" height="16" rx="3" fill="#fbeed6"/>
<text x="726" y="375" font-size="12" fill="#e9ecf2" font-weight="normal" text-anchor="start">JP1 JP2, 3V3/5V</text>
<text x="644" y="406" font-size="12" fill="#c7cede" font-weight="normal" text-anchor="start">4.7 kΩ pull-ups to 3V3 on SDA, SCL</text>
<text x="40" y="520" font-size="18" fill="#1d2433" font-weight="bold" text-anchor="start">Pin plan</text>
<rect x="40" y="538" width="710" height="34" rx="6" fill="#1d2433"/>
<text x="52" y="561" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="start">XIAO pin</text>
<text x="162" y="561" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="start">GPIO</text>
<text x="292" y="561" font-size="13" fill="#ffffff" font-weight="bold" text-anchor="start">Job on the Mini</text>
<rect x="40" y="572" width="710" height="34" fill="#ffffff"/>
<text x="52" y="594" font-size="13" fill="#1d2433" font-weight="bold" text-anchor="start">D0</text>
<text x="162" y="594" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="start">GPIO1</text>
<text x="292" y="594" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start">user button</text>
<rect x="40" y="606" width="710" height="34" fill="#f4f2ec"/>
<text x="52" y="628" font-size="13" fill="#1d2433" font-weight="bold" text-anchor="start">D1</text>
<text x="162" y="628" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="start">GPIO2</text>
<text x="292" y="628" font-size="13" fill="#1f7a4d" font-weight="normal" text-anchor="start">microSD chip select</text>
<rect x="40" y="640" width="710" height="34" fill="#ffffff"/>
<text x="52" y="662" font-size="13" fill="#1d2433" font-weight="bold" text-anchor="start">D2</text>
<text x="162" y="662" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="start">GPIO3</text>
<text x="292" y="662" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start">G4 pin 1, PMS5003 SET</text>
<rect x="40" y="674" width="710" height="34" fill="#f4f2ec"/>
<text x="52" y="696" font-size="13" fill="#1d2433" font-weight="bold" text-anchor="start">D3</text>
<text x="162" y="696" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="start">GPIO4</text>
<text x="292" y="696" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start">G4 pin 2, analog in (battery, any analog Grove)</text>
<rect x="40" y="708" width="710" height="34" fill="#ffffff"/>
<text x="52" y="730" font-size="13" fill="#1d2433" font-weight="bold" text-anchor="start">D4, D5</text>
<text x="162" y="730" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="start">GPIO5, 6</text>
<text x="292" y="730" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start">I2C: G1, G2 and the RTC</text>
<rect x="40" y="742" width="710" height="34" fill="#f4f2ec"/>
<text x="52" y="764" font-size="13" fill="#1d2433" font-weight="bold" text-anchor="start">D6, D7</text>
<text x="162" y="764" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="start">GPIO43, 44</text>
<text x="292" y="764" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start">UART: G3</text>
<rect x="40" y="776" width="710" height="34" fill="#ffffff"/>
<text x="52" y="798" font-size="13" fill="#1d2433" font-weight="bold" text-anchor="start">D8 to D10</text>
<text x="162" y="798" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="start">GPIO7, 8, 9</text>
<text x="292" y="798" font-size="13" fill="#1f7a4d" font-weight="normal" text-anchor="start">SPI: microSD and the Wio-SX1262, each on its own CS</text>
<rect x="40" y="810" width="710" height="34" fill="#f4f2ec"/>
<text x="52" y="832" font-size="13" fill="#1d2433" font-weight="bold" text-anchor="start">—</text>
<text x="162" y="832" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="start">GPIO38 to 42</text>
<text x="292" y="832" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start">LoRa control, board-to-board connector only</text>
<rect x="40" y="538" width="710" height="306" rx="6" fill="none" stroke="#c9c4b6"/>
<text x="790" y="520" font-size="18" fill="#1d2433" font-weight="bold" text-anchor="start">Compared with the Grove Shield</text>
<text x="790" y="554" font-size="13" fill="#5b6475" font-weight="bold" text-anchor="start">Same</text>
<text x="840" y="554" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start">XIAO footprint, 3V3 Grove pinout, all 14 pins</text>
<text x="840" y="576" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start">broken out, the snapped size of 39 × 25 mm.</text>
<text x="790" y="598" font-size="13" fill="#1f7a4d" font-weight="bold" text-anchor="start">New</text>
<text x="840" y="598" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start">Second I2C and an A/D socket where the</text>
<text x="840" y="620" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start">shield's left half has D0 and D1 sockets.</text>
<text x="790" y="642" font-size="13" fill="#1f7a4d" font-weight="bold" text-anchor="start">New</text>
<text x="840" y="642" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start">PCF8563 clock with a coin cell, so a node</text>
<text x="840" y="664" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start">with no WiFi still timestamps its data.</text>
<text x="790" y="686" font-size="13" fill="#1f7a4d" font-weight="bold" text-anchor="start">New</text>
<text x="840" y="686" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start">microSD on the back, to buffer readings</text>
<text x="840" y="708" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start">when the uplink is down.</text>
<text x="790" y="730" font-size="13" fill="#1f7a4d" font-weight="bold" text-anchor="start">New</text>
<text x="840" y="730" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start">G1 and G3 switch to 5 V for PM sensor fans.</text>
<text x="840" y="752" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start">Logic stays 3.3 V, pull-ups go to 3V3.</text>
<text x="790" y="774" font-size="13" fill="#9a5b00" font-weight="bold" text-anchor="start">Gone</text>
<text x="840" y="774" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start">Battery charger and the D8, D9 sockets that</text>
<text x="840" y="796" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start">the LoRa radio takes anyway.</text>
<text x="40" y="880" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start">Every Bayu variant becomes plug and play on this board, including the PMS5003 nodes, once there is a Grove to</text>
<text x="40" y="902" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start">1.25 mm 8-pin cable for the Plantower. The microSD and the LoRa radio share one SPI bus with separate chip selects,</text>
<text x="40" y="924" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start">which the firmware has to handle. The 5 V jumpers only switch the supply pin, so a 5 V module that pulls its own</text>
<text x="40" y="946" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start">I2C lines up to 5 V would still be unsafe for the ESP32-S3 and must not go in G1 set to 5 V.</text>
<text x="40" y="968" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start"></text>
<text x="40" y="990" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="start">Concept drawing, not a layout. Sizes at 12 px per mm for the board, the XIAO, the microSD socket and the coin cell.</text>
</svg>