<text x="84" y="414" font-size="11" fill="#c7cede" font-weight="normal" text-anchor="start">button D0</text>
<text x="620" y="116" font-size="16" fill="#1d2433" font-weight="bold" text-anchor="start">Bottom (seen from below)</text>
<rect x="620" y="130" width="468" height="300" rx="16" fill="#1f2b45"/>
<circle cx="634" cy="144" r="7" fill="#fbfaf6" stroke="#9aa3b5"/>
