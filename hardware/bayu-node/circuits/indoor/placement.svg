<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 1302" role="img" font-family="ui-monospace, Menlo, Consolas, 'DejaVu Sans Mono', monospace" width="1100" height="1302">
  <title>Bayu Indoor placement</title>
  <desc>Where to put a Bayu Indoor node in a classroom, kos room or kitchen: a room section and a room plan with distances to windows, doors, fans, AC, cooking and mosquito coils, the airflow inside the shell, the SCD40&#x27;s need for open air and a weekly airing, and a do and do-not list.</desc>
  <style>
    text { fill: #1d1d1b; }
    .t  { font-size: 22px; font-weight: 700; }
    .st { font-size: 14px; fill: #6b665c; }
    .h  { font-size: 15px; font-weight: 700; }
    .l  { font-size: 13.5px; }
    .s  { font-size: 13px; fill: #6b665c; }
    .p  { font-size: 13px; }
    .pw { font-size: 13px; fill: #ffffff; }
    .b  { font-weight: 700; }
    .halo { paint-order: stroke; stroke: #fbf8f1; stroke-width: 4px; stroke-linejoin: round; }
  </style>
  <defs><marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d1d1b"/></marker><marker id="aa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2f7fbf"/></marker><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#d9480f"/></marker><clipPath id="room"><rect x="695" y="155" width="360" height="310"/></clipPath></defs>
  <rect width="1100" height="1250" fill="#fbf8f1"/>
  <text x="24" y="38" class="t">Bayu Indoor, where to put it</text>
  <text x="24" y="61" class="st">Classrooms, kos rooms and kitchens. The node should breathe the room&#x27;s air once it has mixed, away from breath and smoke.</text>
  <!-- room section: 1 m = 120 px, floor at y=500 -->
