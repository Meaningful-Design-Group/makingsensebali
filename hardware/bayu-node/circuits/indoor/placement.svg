  <rect x="690" y="316" width="12" height="28" rx="2" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.4"/>
  <text x="708" y="308" class="p b halo">node</text>
  <text x="694" y="518" class="s">Rings sit around the sources, with the distance</text>
  <text x="694" y="534" class="s">to keep. The node goes where no ring reaches,</text>
  <text x="694" y="550" class="s">and never under the fan.</text>
  <!-- airflow inside a simple indoor shell -->
  <text x="24" y="576" class="h">Inside the shell</text>
  <text x="180" y="576" class="s">the order of parts, as a sketch</text>
  <rect x="200" y="600" width="150" height="270" rx="10" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.8"/>
  <line x1="200" y1="672" x2="350" y2="672" stroke="#1d1d1b" stroke-width="1.6"/>
  <line x1="200" y1="782" x2="300" y2="782" stroke="#1d1d1b" stroke-width="1.6"/>
  <rect x="240" y="628" width="70" height="30" rx="3" fill="#1f2a33" stroke="#0d1418" stroke-width="1"/>
  <text x="275" y="647" class="pw" text-anchor="middle">XIAO</text>
  <path d="M250,600 L250,592 M275,600 L275,592 M300,600 L300,592" stroke="#ffffff" stroke-width="5"/>
  <path d="M260,624 Q262,600 258,584" fill="none" stroke="#d9480f" stroke-width="1.6" marker-end="url(#ah)"/>
  <path d="M290,624 Q288,600 292,584" fill="none" stroke="#d9480f" stroke-width="1.6" marker-end="url(#ah)"/>
  <rect x="214" y="694" width="116" height="72" rx="3" fill="#cdd2d6" stroke="#6d747a" stroke-width="1.2"/>
  <text x="272" y="721" class="p b" text-anchor="middle">PMS5003</text>
  <rect x="222" y="762" width="34" height="6" fill="#ffffff" stroke="#6d747a"/>
  <text x="272" y="738" class="s" text-anchor="middle">inlet below,</text>
  <text x="272" y="754" class="s" text-anchor="middle">outlet right</text>
  <path d="M350,706 L350,746" stroke="#fbf8f1" stroke-width="5"/>
  <path d="M330,726 L382,712" fill="none" stroke="#d9480f" stroke-width="2.2" marker-end="url(#ah)"/>
  <rect x="211" y="806" width="52" height="30" rx="3" fill="#2f4f3a" stroke="#17291e" stroke-width="1"/>
  <text x="237" y="825" class="pw" text-anchor="middle">SCD40</text>
  <rect x="272" y="812" width="30" height="20" rx="3" fill="#2f4f3a" stroke="#17291e" stroke-width="1"/>
  <text x="287" y="826" class="pw" text-anchor="middle">SHT</text>
  <path d="M216,870 L216,878 M236,870 L236,878 M256,870 L256,878 M276,870 L276,878 M296,870 L296,878 M316,870 L316,878 M336,870 L336,878" stroke="#fbf8f1" stroke-width="6"/>
  <path d="M350,826 L350,858" stroke="#fbf8f1" stroke-width="5"/>
  <path d="M236,904 L236,872" fill="none" stroke="#2f7fbf" stroke-width="2" marker-end="url(#aa)"/>
  <path d="M300,904 L300,872" fill="none" stroke="#2f7fbf" stroke-width="2" marker-end="url(#aa)"/>
  <path d="M384,846 L354,846" fill="none" stroke="#2f7fbf" stroke-width="2" marker-end="url(#aa)"/>
  <path d="M240,800 Q238,790 240,772" fill="none" stroke="#2f7fbf" stroke-width="1.6" marker-end="url(#aa)"/>
  <text x="392" y="616" class="l b">XIAO and its WiFi</text>
  <text x="392" y="632" class="s">radio on top, own vent:</text>
  <text x="392" y="648" class="s">its heat rises out</text>
  <text x="392" y="664" class="s">and never reaches</text>
  <text x="392" y="680" class="s">the sensors.</text>
  <text x="392" y="712" class="l b">PMS exhaust leaves</text>
  <text x="392" y="728" class="s">high and sideways,</text>
  <text x="392" y="744" class="s">away from the intake.</text>
  <text x="392" y="790" class="l b">SCD40 and SHT40 sit</text>
  <text x="392" y="806" class="s">in the intake air,</text>
  <text x="392" y="822" class="s">upstream of the PMS,</text>
  <text x="392" y="838" class="s">below the baffle.</text>
  <text x="24" y="620" class="s">Node V2 lost its</text>
  <text x="24" y="636" class="s">temperature channel</text>
  <text x="24" y="652" class="s">to radio heat in one</text>
  <text x="24" y="668" class="s">closed box. Bottom to</text>
  <text x="24" y="684" class="s">top: sensors, PMS,</text>
  <text x="24" y="700" class="s">XIAO.</text>
  <text x="24" y="924" class="s">Room air in at the bottom and the side.</text>
  <!-- SCD40: open air, weekly fresh air for ASC -->
  <text x="590" y="576" class="h">The SCD40 needs open air, and fresh air once a week</text>
  <text x="590" y="600" class="l">It reads CO2 through a membrane on top of the part. Give</text>
  <text x="590" y="617" class="l">its bay openings on two faces so room air moves through,</text>
  <text x="590" y="634" class="l">leave the membrane bare, and mask it before the board is</text>
  <text x="590" y="651" class="l">coated. In a closed pocket it reads stale air and answers</text>
  <text x="590" y="668" class="l">late.</text>
  <g transform="translate(0 36)">
  <rect x="610" y="680" width="450" height="160" fill="#ffffff" stroke="#cfc6b4"/>
  <line x1="610" y1="840" x2="1060" y2="840" stroke="#ece6da"/>
  <text x="604" y="844" class="s" text-anchor="end">400</text>
  <line x1="610" y1="780" x2="1060" y2="780" stroke="#ece6da"/>
  <text x="604" y="784" class="s" text-anchor="end">1000</text>
  <line x1="610" y1="730" x2="1060" y2="730" stroke="#ece6da"/>
  <text x="604" y="734" class="s" text-anchor="end">1500</text>
  <line x1="610" y1="680" x2="1060" y2="680" stroke="#ece6da"/>
  <text x="604" y="684" class="s" text-anchor="end">2000</text>
  <text x="604" y="664" class="s" text-anchor="end">ppm</text>
  <text x="642.143" y="856" class="s" text-anchor="middle">Mon</text>
  <text x="706.429" y="856" class="s" text-anchor="middle">Tue</text>
  <line x1="674.286" y1="680" x2="674.286" y2="840" stroke="#ece6da"/>
  <text x="770.714" y="856" class="s" text-anchor="middle">Wed</text>
  <line x1="738.571" y1="680" x2="738.571" y2="840" stroke="#ece6da"/>
  <text x="835" y="856" class="s" text-anchor="middle">Thu</text>
  <line x1="802.857" y1="680" x2="802.857" y2="840" stroke="#ece6da"/>
  <text x="899.286" y="856" class="s" text-anchor="middle">Fri</text>
  <line x1="867.143" y1="680" x2="867.143" y2="840" stroke="#ece6da"/>
  <text x="963.571" y="856" class="s" text-anchor="middle">Sat</text>
  <line x1="931.429" y1="680" x2="931.429" y2="840" stroke="#ece6da"/>
  <text x="1027.86" y="856" class="s" text-anchor="middle">Sun</text>
  <line x1="995.714" y1="680" x2="995.714" y2="840" stroke="#ece6da"/>
  <polyline points="610.0,828.0 629.3,816.0 637.0,730.0 645.4,760.0 653.7,715.0 660.1,790.0 674.3,818.0 674.3,818.0 693.6,816.0 701.3,730.0 709.6,760.0 718.0,715.0 724.4,790.0 738.6,818.0 738.6,818.0 757.9,816.0 765.6,730.0 773.9,760.0 782.3,715.0 788.7,790.0 802.9,818.0 802.9,818.0 822.1,816.0 829.9,730.0 838.2,760.0 846.6,715.0 853.0,790.0 867.1,818.0 867.1,818.0 886.4,816.0 894.1,730.0 902.5,760.0 910.9,715.0 917.3,790.0 931.4,818.0 963.6,833.0 995.7,836.8 1060.0,836.2" fill="none" stroke="#1f6fd6" stroke-width="2"/>
  <line x1="610" y1="837.5" x2="1060" y2="837.5" stroke="#2a9d4b" stroke-width="1.4" stroke-dasharray="5 4"/>
  <rect x="940" y="726" width="118" height="56" rx="4" fill="#ffffff" stroke="#2a9d4b" stroke-width="1.1"/>
  <text x="945" y="743" class="s">empty weekend,</text>
  <text x="945" y="759" class="s">≈ outdoor air</text>
  <text x="945" y="775" class="s">(dashed, ~425)</text>
  <line x1="1010" y1="782" x2="1010" y2="832" stroke="#2a9d4b" stroke-width="1.2"/>
  </g>
  <text x="590" y="922" class="l">Automatic self-calibration takes the lowest air it sees</text>
  <text x="590" y="939" class="l">each week as outdoor air. A classroom empty at the weekend</text>
  <text x="590" y="956" class="l">gives it that. A kos room with the AC on and the door shut</text>
  <text x="590" y="973" class="l">does not: open window and door 10 minutes once a week, or</text>
  <text x="590" y="990" class="l">its CO2 drifts. Curve for illustration only.</text>
  <!-- do and do not -->
  <rect x="24" y="1014" width="520" height="152" rx="6" fill="#f3f8f2" stroke="#2a9d4b" stroke-width="1.1"/>
  <text x="36" y="1036" class="h">Do</text>
  <text x="36" y="1057" class="l">Mount at 1.1 to 1.5 m on an inside wall, facing the room.</text>
  <text x="36" y="1076" class="l">Keep 1 m from where people sit or sleep.</text>
  <text x="36" y="1095" class="l">Keep 1 m from windows and doors, 2 m from AC and stove.</text>
  <text x="36" y="1114" class="l">Leave 15 cm of free air round the intake and vents.</text>
  <text x="36" y="1133" class="l">Air the room fully for 10 minutes once a week.</text>
  <text x="36" y="1152" class="l">Mask the SCD40 and SHT40 before coating the board.</text>
  <rect x="560" y="1014" width="516" height="152" rx="6" fill="#fbf1ee" stroke="#d9480f" stroke-width="1.1"/>
  <text x="572" y="1036" class="h">Do not</text>
  <text x="572" y="1057" class="l">Put it in direct sun or on a sun-warmed outer wall.</text>
  <text x="572" y="1076" class="l">Hang it in the throw of an AC or under a ceiling fan.</text>
  <text x="572" y="1095" class="l">Mount it above a stove, rice cooker, coil or incense.</text>
  <text x="572" y="1114" class="l">Shut it in a cupboard, behind a curtain or in a corner.</text>
  <text x="572" y="1133" class="l">Seal the shell, or glue or coat over a sensor.</text>
  <text x="572" y="1152" class="l">Put the SHT40 or SCD40 beside the XIAO or the PMS exhaust.</text>
  <text x="24" y="1196" class="s">Sources: Sensirion SCD4x datasheet v1.7 (ASC needs 400 ppm air at least 3 minutes a week); Plantower PMS5003</text>
  <text x="24" y="1213" class="s">manual v2.3 (keep the inlet free, out of air-cleaner streams); Welsh Government CO2 monitor guidance for schools</text>
  <text x="24" y="1230" class="s">(seated head height, away from vents and windows, at least 0.5 m from people). The ring distances are our rule.</text>
