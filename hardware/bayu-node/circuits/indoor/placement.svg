  <rect x="1042" y="256" width="14" height="62" rx="3" fill="#ffffff" stroke="#1d1d1b" stroke-width="1.3"/>
  <text x="1036" y="250" class="p b halo" text-anchor="end">AC · <tspan style="fill:#d9480f">2 m</tspan></text>
  <path d="M1040,270 L990,262" fill="none" stroke="#2f7fbf" stroke-width="1.5" marker-end="url(#aa)" stroke-dasharray="4 3"/>
  <path d="M1040,304 L990,312" fill="none" stroke="#2f7fbf" stroke-width="1.5" marker-end="url(#aa)" stroke-dasharray="4 3"/>
  <circle cx="930" cy="300" r="44" fill="none" stroke="#8c877b" stroke-width="1.2" stroke-dasharray="3 3"/>
  <path d="M930,300 L930,262 M930,300 L963,319 M930,300 L897,319" stroke="#8c877b" stroke-width="3" stroke-linecap="round"/>
  <text x="930" y="366" class="s halo" text-anchor="middle">fan, never under it</text>
  <rect x="984" y="160" width="70" height="40" rx="2" fill="#efe7d6" stroke="#8c877b" stroke-width="1.1"/>
