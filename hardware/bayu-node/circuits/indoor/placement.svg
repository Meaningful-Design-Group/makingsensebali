  <rect x="870" y="396" width="120" height="62" rx="3" fill="#efe7d6" stroke="#8c877b" stroke-width="1.1"/>
  <text x="930" y="432" class="s" text-anchor="middle">bed</text>
  <rect x="810" y="196" width="70" height="36" rx="3" fill="#efe7d6" stroke="#8c877b" stroke-width="1.1"/>
  <text x="845" y="218" class="s" text-anchor="middle">desk</text>
