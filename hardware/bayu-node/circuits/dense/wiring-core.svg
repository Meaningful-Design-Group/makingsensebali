<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1200 852" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, monospace" width="1200" height="852">
  <title>Bayu Dense on the Bayu Core board</title>
  <desc>Connector map of the planned 60 by 40 mm Bayu Core carrier as fitted for the Dense role: XIAO socket, PicoBlade 8-pin to the PMS5003T, Grove socket for button and LED, and the connectors left empty.</desc>
  <style>
    .t1  { font-size: 17px; font-weight: 700; fill: #111; }
    .t2  { font-size: 11.5px; fill: #555; }
    .lab { font-size: 10.5px; fill: #222; }
    .sm  { font-size: 9px; fill: #555; }
    .pn  { font-size: 8.5px; fill: #fff; }
    .th  { font-size: 10px; font-weight: 700; fill: #111; }
    .td  { font-size: 10px; fill: #222; }
    .off { fill: #f1f1ee; stroke: #aaa; stroke-dasharray: 3 2; }
    .tr  { fill: none; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
  </style>

  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="24" y="36" class="t1">Bayu Dense · on the Bayu Core carrier (phase 1)</text>
  <text x="24" y="56" class="t2">Connector map, top view, 10 px = 1 mm. The Core is planned, not routed yet: positions are indicative, the pin-to-net map is not.</text>
  <text x="24" y="74" class="t2">Solid = fitted for Dense. Grey dashed = on the board, left empty for this role.</text>

  <!-- board 60 x 40 mm -->
  <rect x="80" y="140" width="600" height="400" rx="10" fill="#e6eee2" stroke="#4b6b45" stroke-width="2"/>
  <text x="380" y="562" text-anchor="middle" class="sm">60 mm</text>
  <text x="696" y="344" class="sm" transform="rotate(90 696 344)" text-anchor="middle">40 mm</text>
  <g fill="#fff" stroke="#4b6b45" stroke-width="1.5">
    <circle cx="104" cy="164" r="8"/><circle cx="656" cy="164" r="8"/><circle cx="656" cy="516" r="8"/>
  </g>
  <text x="120" y="160" class="sm">M2.5</text>

  <!-- not fitted on Dense -->
  <rect x="310" y="146" width="84" height="20" rx="2" class="off"/>
  <text x="352" y="182" text-anchor="middle" class="sm">SEN54 · GH 6</text>
  <rect x="420" y="146" width="64" height="26" rx="2" class="off"/>
  <rect x="500" y="146" width="64" height="26" rx="2" class="off"/>
  <text x="492" y="188" text-anchor="middle" class="sm">Grove I2C ×2 (SHT40…)</text>
  <rect x="300" y="200" width="22" height="12" rx="2" class="off"/>
  <text x="330" y="210" class="sm">JP1 I2C pull-ups, open</text>
  <rect x="300" y="508" width="34" height="18" rx="2" class="off"/>
  <text x="342" y="521" class="sm">5V IN · PH 2</text>

  <!-- 5 V path: XIAO 5V (VBUS) through the polyfuse -->
  <path class="tr" stroke="#d62828" d="M105 264 V215 H124"/>
  <rect x="124" y="207" width="40" height="16" rx="3" fill="#fff" stroke="#d62828" stroke-width="2"/>
  <text x="144" y="219" text-anchor="middle" style="font-size:8.5px;fill:#d62828;font-weight:700">F1 1A</text>
  <path class="tr" stroke="#d62828" d="M164 215 H190"/>
  <text x="196" y="219" class="lab" fill="#d62828" style="fill:#d62828;font-weight:700">+5V</text>
  <!-- GND and 3V3 at the XIAO -->
  <path class="tr" stroke="#222" d="M130.4 264 V246"/>
  <path d="M121.4 244 H139.4 M124.4 239 H136.4 M127.4 234 H133.4" stroke="#222" stroke-width="1.6"/>
  <path class="tr" stroke="#f08c00" d="M155.8 264 V238"/>
  <text x="162" y="232" style="font-size:9.5px;fill:#c26d00;font-weight:700">3V3</text>

  <!-- XIAO socket, USB-C facing out of the board edge -->
  <rect x="62" y="318" width="26" height="44" rx="6" fill="#c9c9c9" stroke="#777"/>
  <rect x="80" y="251" width="210" height="178" rx="12" fill="#2b2b2b" stroke="#111" stroke-width="1.5"/>
  <rect x="72" y="241" width="228" height="198" rx="14" fill="none" stroke="#555" stroke-width="1.5" stroke-dasharray="6 4"/>
  <g fill="#d9a520" stroke="#7a5a00">
    <circle cx="105" cy="264" r="5"/><circle cx="130.4" cy="264" r="5"/><circle cx="155.8" cy="264" r="5"/><circle cx="181.2" cy="264" r="5"/><circle cx="206.6" cy="264" r="5"/><circle cx="232" cy="264" r="5"/><circle cx="257.4" cy="264" r="5"/>
    <circle cx="105" cy="416.4" r="5"/><circle cx="130.4" cy="416.4" r="5"/><circle cx="155.8" cy="416.4" r="5"/><circle cx="181.2" cy="416.4" r="5"/><circle cx="206.6" cy="416.4" r="5"/><circle cx="232" cy="416.4" r="5"/><circle cx="257.4" cy="416.4" r="5"/>
  </g>
  <g class="pn">
    <text transform="translate(108 276) rotate(90)"><tspan font-weight="700">5V</tspan><tspan fill="#bbb" dx="4">VBUS</tspan></text>
    <text transform="translate(133.4 276) rotate(90)" font-weight="700">GND</text>
    <text transform="translate(158.8 276) rotate(90)" font-weight="700">3V3</text>
    <text transform="translate(184.2 276) rotate(90)"><tspan font-weight="700" fill="#f2b84b">D10</tspan><tspan fill="#bbb" dx="4">GPIO9</tspan></text>
    <text transform="translate(209.6 276) rotate(90)"><tspan font-weight="700" fill="#f2b84b">D9</tspan><tspan fill="#bbb" dx="4">GPIO8</tspan></text>
    <text transform="translate(235 276) rotate(90)"><tspan font-weight="700" fill="#f2b84b">D8</tspan><tspan fill="#bbb" dx="4">GPIO7</tspan></text>
    <text transform="translate(260.4 276) rotate(90)"><tspan font-weight="700">D7</tspan><tspan fill="#bbb" dx="4">GPIO44</tspan></text>
    <text transform="translate(108 404) rotate(-90)"><tspan font-weight="700">D0</tspan><tspan fill="#bbb" dx="4">GPIO1</tspan></text>
    <text transform="translate(133.4 404) rotate(-90)"><tspan font-weight="700">D1</tspan><tspan fill="#bbb" dx="4">GPIO2</tspan></text>
    <text transform="translate(158.8 404) rotate(-90)"><tspan font-weight="700">D2</tspan><tspan fill="#bbb" dx="4">GPIO3</tspan></text>
    <text transform="translate(184.2 404) rotate(-90)"><tspan font-weight="700">D3</tspan><tspan fill="#bbb" dx="4">GPIO4</tspan></text>
    <text transform="translate(209.6 404) rotate(-90)"><tspan font-weight="700">D4</tspan><tspan fill="#bbb" dx="4">GPIO5</tspan></text>
    <text transform="translate(235 404) rotate(-90)"><tspan font-weight="700">D5</tspan><tspan fill="#bbb" dx="4">GPIO6</tspan></text>
    <text transform="translate(260.4 404) rotate(-90)"><tspan font-weight="700">D6</tspan><tspan fill="#bbb" dx="4">GPIO43</tspan></text>
  </g>
  <text x="310" y="300" class="lab" font-weight="700">XIAO ESP32-S3, socketed</text>
  <text x="310" y="316" class="sm">USB-C at the board edge = 5 V in.</text>
  <text x="310" y="336" class="sm">Dashed outline: Wio-SX1262 LoRa stacks</text>
  <text x="310" y="348" class="sm">on top (optional). Keep 25 mm clear above</text>
  <text x="310" y="360" class="sm">and a path for its U.FL pigtail to the</text>
  <text x="310" y="372" class="sm">SMA bulkhead. <tspan fill="#c4861a" font-weight="700">D8 D9 D10</tspan> carry its SPI:</text>
  <text x="310" y="384" class="sm">no traces on them.</text>
  <text x="310" y="400" class="sm" style="fill:#d62828">Header in the XIAO only, stubs flush:</text>
  <text x="310" y="412" class="sm" style="fill:#d62828">the Wio's edge pads carry radio lines.</text>

  <!-- signal traces to the PicoBlade -->
  <path class="tr" stroke="#55a630" d="M257.4 264 H575 V333.5 H626"/>
  <path class="tr" stroke="#1b6e3a" d="M257.4 416.4 V450 H590 V346 H626"/>
  <path class="tr" stroke="#7b2cbf" d="M155.8 416.4 V470 H605 V358.5 H626"/>
  <!-- RESET pull-up -->
  <path class="tr" stroke="#888" d="M626 321 H614 V300" style="stroke-width:2.5"/>
  <rect x="608" y="262" width="12" height="38" fill="#fff" stroke="#555" stroke-width="1.5"/>
  <path class="tr" stroke="#f08c00" d="M614 262 V246" style="stroke-width:2.5"/>
  <text x="614" y="240" text-anchor="middle" style="font-size:9px;fill:#c26d00;font-weight:700">3V3</text>
  <text x="626" y="272" class="sm">R1 10k</text>

  <!-- PicoBlade 8 for the PMS5003T, pin 8 at the top -->
  <rect x="624" y="288" width="18" height="104" rx="2" fill="#f7f7f2" stroke="#222" stroke-width="1.5"/>
  <g fill="#c9a227" stroke="#7a5a00" stroke-width="0.8">
    <rect x="628" y="293" width="8" height="6"/><rect x="628" y="305.5" width="8" height="6"/><rect x="628" y="318" width="8" height="6"/><rect x="628" y="330.5" width="8" height="6"/>
    <rect x="628" y="343" width="8" height="6"/><rect x="628" y="355.5" width="8" height="6"/><rect x="628" y="368" width="8" height="6"/><rect x="628" y="380.5" width="8" height="6"/>
  </g>
  <g style="font-size:8.5px">
    <text x="648" y="299" fill="#888">8</text><text x="648" y="311.5" fill="#888">7</text><text x="648" y="324" fill="#888">6</text><text x="648" y="336.5" fill="#222">5</text>
    <text x="648" y="349" fill="#222">4</text><text x="648" y="361.5" fill="#222">3</text><text x="648" y="374" fill="#222">2</text><text x="648" y="386.5" fill="#222">1</text>
  </g>
  <text x="626" y="408" class="lab" font-weight="700">PMS</text>
  <text x="626" y="420" class="sm">PicoBlade</text>
  <text x="626" y="431" class="sm">8-pin</text>

  <!-- Grove IO socket: button and LED -->
  <path class="tr" stroke="#1d70b8" d="M105 416.4 V500"/>
  <path class="tr" stroke="#1d70b8" d="M130.4 416.4 V440 H125 V500"/>
  <rect x="94" y="500" width="82" height="30" rx="3" fill="#fafafa" stroke="#222" stroke-width="1.5"/>
  <g stroke="#222" stroke-width="0.8">
    <circle cx="105" cy="515" r="4" fill="#f2c94c"/><circle cx="125" cy="515" r="4" fill="#fff"/><circle cx="145" cy="515" r="4" fill="#d62828"/><circle cx="165" cy="515" r="4" fill="#222"/>
  </g>
  <text x="190" y="512" class="lab" font-weight="700">IO · Grove</text>
  <text x="190" y="526" class="sm">button D0, LED D1</text>

  <!-- tables -->
  <g transform="translate(730 150)">
    <text x="0" y="0" class="lab" font-weight="700">PMS · Molex PicoBlade 1.25 mm, 8-pin → PMS5003T</text>
    <line x1="0" y1="10" x2="440" y2="10" stroke="#999"/>
    <text x="0" y="26" class="th">pin</text><text x="34" y="26" class="th">sensor</text><text x="100" y="26" class="th">net</text><text x="230" y="26" class="th">XIAO</text>
    <line x1="0" y1="34" x2="440" y2="34" stroke="#ddd"/>
    <text x="0" y="50" class="td">1</text><text x="34" y="50" class="td">VCC</text><text x="100" y="50" class="td" fill="#d62828" style="fill:#d62828">+5V</text><text x="230" y="50" class="td">5V (VBUS) via F1</text>
    <text x="0" y="68" class="td">2</text><text x="34" y="68" class="td">GND</text><text x="100" y="68" class="td">GND</text><text x="230" y="68" class="td">GND</text>
    <text x="0" y="86" class="td">3</text><text x="34" y="86" class="td">SET</text><text x="100" y="86" class="td" style="fill:#7b2cbf">PMS_SET</text><text x="230" y="86" class="td">D2 · GPIO3</text>
    <text x="0" y="104" class="td">4</text><text x="34" y="104" class="td">RXD</text><text x="100" y="104" class="td" style="fill:#1b6e3a">PMS_RXD</text><text x="230" y="104" class="td">D6 · GPIO43 (TX)</text>
    <text x="0" y="122" class="td">5</text><text x="34" y="122" class="td">TXD</text><text x="100" y="122" class="td" style="fill:#3d7a1f">PMS_TXD</text><text x="230" y="122" class="td">D7 · GPIO44 (RX)</text>
    <text x="0" y="140" class="td">6</text><text x="34" y="140" class="td">RESET</text><text x="100" y="140" class="td">PMS_RST</text><text x="230" y="140" class="td">— R1 10k to 3V3</text>
    <text x="0" y="158" class="td" fill="#888" style="fill:#888">7, 8</text><text x="34" y="158" class="td" style="fill:#888">NC</text><text x="100" y="158" class="td" style="fill:#888">—</text><text x="230" y="158" class="td" style="fill:#888">—</text>

    <text x="0" y="206" class="lab" font-weight="700">IO · Grove 4-pin → button and WS2812</text>
    <line x1="0" y1="216" x2="440" y2="216" stroke="#999"/>
    <text x="0" y="232" class="th">pin</text><text x="34" y="232" class="th">wire</text><text x="100" y="232" class="th">net</text><text x="230" y="232" class="th">XIAO</text>
    <line x1="0" y1="240" x2="440" y2="240" stroke="#ddd"/>
    <text x="0" y="256" class="td">1</text><text x="34" y="256" class="td">yellow</text><text x="100" y="256" class="td" style="fill:#1d70b8">BTN</text><text x="230" y="256" class="td">D0 · GPIO1, to GND</text>
    <text x="0" y="274" class="td">2</text><text x="34" y="274" class="td">white</text><text x="100" y="274" class="td" style="fill:#1d70b8">LED_DIN</text><text x="230" y="274" class="td">D1 · GPIO2</text>
    <text x="0" y="292" class="td">3</text><text x="34" y="292" class="td">red</text><text x="100" y="292" class="td" style="fill:#c26d00">3V3</text><text x="230" y="292" class="td">3V3</text>
    <text x="0" y="310" class="td">4</text><text x="34" y="310" class="td">black</text><text x="100" y="310" class="td">GND</text><text x="230" y="310" class="td">GND</text>

    <text x="0" y="358" class="lab" font-weight="700">Left empty on a Dense node</text>
    <line x1="0" y1="368" x2="440" y2="368" stroke="#999"/>
    <text x="0" y="386" class="td">SEN54 · JST GH 6 ......... Anchor only</text>
    <text x="0" y="404" class="td">Grove I2C ×2, JP1 ........ SHT40, SCD40 roles</text>
    <text x="0" y="422" class="td">5V IN · JST PH 2 ......... Bayu Power board</text>
    <text x="0" y="440" class="td">D3 · GPIO4 ............... battery sense, Power only</text>
  </g>

  <!-- notes -->
  <text x="24" y="626" class="lab">Same nets as the breadboard: wire colours carry over (red 5 V, black GND, orange 3V3, greens UART, purple SET, blue button/LED).</text>
  <text x="24" y="646" class="lab">The PicoBlade takes the PMS5003T's own cable, no adapter. Plug it with the cable's pin 1 (often the red or the marked wire) at pin 1 here.</text>
  <text x="24" y="666" class="lab">R1 holds RESET high so a long cable cannot reset the sensor; on the breadboard the pin is simply left open.</text>
  <text x="24" y="686" class="lab">F1 is a 1 A resettable fuse between VBUS and the sensor rail: a shorted cable trips it, not the USB supply.</text>
  <text x="24" y="714" class="sm">When the 5V IN header is used, Seeed asks for a diode between an outside 5 V source and the XIAO's 5V pin. Not a Dense concern; noted for the Core layout.</text>
<g data-stamp="bayu" font-family="Helvetica, Arial, sans-serif" font-size="13"><rect x="0" y="800" width="1200" height="52" fill="#ffffff"/><line x1="0" y1="800" x2="1200" y2="800" stroke="#c9c4b6"/><text x="20" y="822" fill="#1d2433" font-weight="bold">Bayu Dense · Bayu Core connector map, phase 1 · rev 2026-10-24</text><text x="20" y="841" fill="#5b6475">CERN-OHL-W-2.0 · Meaningful Design Group / Fab Lab Bali · github.com/Meaningful-Design-Group/makingsensebali</text></g>
</svg>
