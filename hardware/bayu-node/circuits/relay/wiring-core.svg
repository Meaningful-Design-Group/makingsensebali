<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1240 952" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace" width="1240" height="952">
  <title>Bayu Relay on the Bayu Core</title>
  <desc>Connector map of the planned 60 x 40 mm Bayu Core carrier as fitted for the Relay: XIAO socket with the Wio-SX1262 stack, SHT40 on Grove I2C socket G1, button and WS2812B on the D0/D1 Grove socket G3, empty SEN54 and PMS5003 connectors, LoRa pigtail to an SMA bulkhead and WiFi antenna route.</desc>
  <style>
    .t    { font-size: 15px; font-weight: 700; fill: #111; }
    .st   { font-size: 11px; fill: #555; }
    .pin  { font-size: 9.5px; fill: #111; }
    .off  { font-size: 9.5px; fill: #9a948a; }
    .spi  { font-size: 9.5px; fill: #b3261e; }
    .lab  { font-size: 10.5px; fill: #222; }
    .sm   { font-size: 9px; fill: #555; }
    .gr   { font-size: 9px; fill: #9a948a; }
    .silk { font-size: 11px; font-weight: 700; fill: #2d4a3e; }
    .silks{ font-size: 9px; fill: #2d4a3e; }
    .warn { font-size: 10.5px; fill: #b3261e; }
    .hw   { font-size: 12px; font-weight: 700; fill: #b3261e; }
    .h    { font-size: 12px; font-weight: 700; fill: #111; }
    .row  { font-size: 10px; fill: #222; }
    .rowg { font-size: 10px; fill: #9a948a; }
  </style>
  <defs>
    <pattern id="hatch" width="6" height="6" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="6" stroke="#9a948a" stroke-width="1.2"/>
    </pattern>
  </defs>

  <rect width="1240" height="900" fill="#fbf8f2"/>
  <text x="40" y="34" class="t">Bayu Relay · connector map on the Bayu Core</text>
  <text x="40" y="54" class="st">planned 60 × 40 mm carrier, top view, 9 px per mm · only the connectors a Relay uses are coloured</text>

  <!-- LoRa route to the bulkhead -->
  <rect x="470" y="84" width="22" height="14" fill="#c9a640" stroke="#6b5a2a"/>
  <rect x="476" y="64" width="10" height="20" rx="4" fill="#2a2a2a"/>
  <text x="500" y="80" class="lab">SMA bulkhead + whip</text>
  <text x="500" y="93" class="sm">in the hood's high facet</text>
  <path d="M444 318 H481 V98" fill="none" stroke="#333" stroke-width="2.4" stroke-dasharray="6 4"/>
  <text x="474" y="124" class="sm" text-anchor="end">LoRa pigtail from the</text>
  <text x="474" y="136" class="sm" text-anchor="end">Wio's U.FL, off the board</text>

  <!-- board -->
  <rect x="260" y="170" width="540" height="360" rx="10" fill="#e6efe8" stroke="#2d4a3e" stroke-width="1.8"/>
  <g fill="#fbf8f2" stroke="#2d4a3e"><circle cx="784" cy="186" r="7"/><circle cx="784" cy="514" r="7"/><circle cx="276" cy="514" r="7"/></g>
  <text x="590" y="252" class="silk" text-anchor="middle">BAYU CORE</text>
  <text x="590" y="267" class="silks" text-anchor="middle">Relay: SHT40 · button + LED · LoRa</text>
  <text x="270" y="548" class="gr">M2.5 × 3, perfboard pattern</text>

  <!-- XIAO socket, USB-C over the left edge -->
  <rect x="240" y="311" width="22" height="30" rx="3" fill="#bdbdbd" stroke="#555"/>
  <rect x="250" y="246" width="194" height="160" rx="5" fill="#f3efe6" stroke="#222" stroke-width="1.4" stroke-dasharray="5 3"/>
  <rect x="268" y="250" width="162" height="16" fill="#3a3a3a"/>
  <rect x="268" y="386" width="162" height="16" fill="#3a3a3a"/>
  <text x="347" y="316" class="lab" text-anchor="middle">XIAO ESP32-S3</text>
  <text x="347" y="330" class="sm" text-anchor="middle">Wio-SX1262 on top</text>
  <text x="347" y="344" class="sm" text-anchor="middle">25 mm clear above</text>
  <text x="236" y="306" class="sm" text-anchor="end">USB-C</text>
  <text x="236" y="318" class="sm" text-anchor="end">5 V in</text>

  <!-- pin dots: top row 5V GND 3V3 D10 D9 D8 D7, bottom row D0..D6 -->
  <g stroke="#111" stroke-width="0.8">
    <circle cx="280" cy="258" r="5" fill="#c8c2b6"/>
    <circle cx="303" cy="258" r="5" fill="#1a1a1a"/>
    <circle cx="326" cy="258" r="5" fill="#f28c28"/>
    <circle cx="349" cy="258" r="5" fill="#e8b4ae"/>
    <circle cx="372" cy="258" r="5" fill="#e8b4ae"/>
    <circle cx="395" cy="258" r="5" fill="#e8b4ae"/>
    <circle cx="418" cy="258" r="5" fill="#c8c2b6"/>
    <circle cx="280" cy="394" r="5" fill="#2e9e4f"/>
    <circle cx="303" cy="394" r="5" fill="#8a4fd1"/>
    <circle cx="326" cy="394" r="5" fill="#c8c2b6"/>
    <circle cx="349" cy="394" r="5" fill="#c8c2b6"/>
    <circle cx="372" cy="394" r="5" fill="#1f6fd1"/>
    <circle cx="395" cy="394" r="5" fill="#f2c418"/>
    <circle cx="418" cy="394" r="5" fill="#c8c2b6"/>
  </g>
  <g>
    <text transform="translate(283 242) rotate(-90)" class="off">5V</text>
    <text transform="translate(306 242) rotate(-90)" class="pin">GND</text>
    <text transform="translate(329 242) rotate(-90)" class="pin">3V3</text>
    <text transform="translate(352 242) rotate(-90)" class="spi">D10·GPIO9</text>
    <text transform="translate(375 242) rotate(-90)" class="spi">D9·GPIO8</text>
    <text transform="translate(398 242) rotate(-90)" class="spi">D8·GPIO7</text>
    <text transform="translate(421 242) rotate(-90)" class="off">D7·GPIO44</text>
    <text transform="translate(283 410) rotate(-90)" class="pin" text-anchor="end">D0·GPIO1</text>
    <text transform="translate(306 410) rotate(-90)" class="pin" text-anchor="end">D1·GPIO2</text>
    <text transform="translate(329 410) rotate(-90)" class="off" text-anchor="end">D2·GPIO3</text>
    <text transform="translate(352 410) rotate(-90)" class="off" text-anchor="end">D3·GPIO4</text>
    <text transform="translate(375 410) rotate(-90)" class="pin" text-anchor="end">D4·GPIO5</text>
    <text transform="translate(398 410) rotate(-90)" class="pin" text-anchor="end">D5·GPIO6</text>
    <text transform="translate(421 410) rotate(-90)" class="off" text-anchor="end">D6·GPIO43</text>
  </g>

  <!-- WiFi antenna route -->
  <path d="M440 380 H452 V566 H352" fill="none" stroke="#777" stroke-width="2"/>
  <rect x="272" y="560" width="80" height="12" rx="2" fill="#e7d9b9" stroke="#8a6d3b"/>
  <text x="272" y="590" class="sm">WiFi antenna on the XIAO's own U.FL,</text>
  <text x="272" y="602" class="sm">on the wall opposite the LoRa pigtail</text>

  <!-- empty connectors on the top edge -->
  <rect x="560" y="172" width="70" height="18" fill="#d9d4ca" stroke="#9a948a"/>
  <rect x="660" y="172" width="96" height="18" fill="#d9d4ca" stroke="#9a948a"/>
  <text x="595" y="146" class="gr" text-anchor="middle">GH 6-pin · SEN54</text>
  <text x="595" y="158" class="gr" text-anchor="middle">empty on Relay</text>
  <text x="708" y="146" class="gr" text-anchor="middle">PicoBlade 8 · PMS5003</text>
  <text x="708" y="158" class="gr" text-anchor="middle">empty on Relay</text>

  <!-- G1 Grove I2C, right edge -->
  <rect x="772" y="236" width="28" height="72" rx="2" fill="#ffffff" stroke="#222"/>
  <g stroke="#111" stroke-width="0.8">
    <circle cx="786" cy="245" r="5" fill="#f2c418"/><circle cx="786" cy="263" r="5" fill="#1f6fd1"/><circle cx="786" cy="281" r="5" fill="#f28c28"/><circle cx="786" cy="299" r="5" fill="#1a1a1a"/>
  </g>
  <g class="pin" text-anchor="end"><text x="766" y="248">SCL 1</text><text x="766" y="266">SDA 2</text><text x="766" y="284">3V3 3</text><text x="766" y="302">GND 4</text></g>
  <text x="772" y="230" class="lab" text-anchor="end">G1 Grove I²C</text>

  <!-- G2 Grove I2C, right edge -->
  <rect x="772" y="336" width="28" height="72" rx="2" fill="#ffffff" stroke="#222"/>
  <g stroke="#111" stroke-width="0.8">
    <circle cx="786" cy="345" r="5" fill="#f2c418"/><circle cx="786" cy="363" r="5" fill="#1f6fd1"/><circle cx="786" cy="381" r="5" fill="#f28c28"/><circle cx="786" cy="399" r="5" fill="#1a1a1a"/>
  </g>
  <g class="pin" text-anchor="end"><text x="766" y="348">SCL 1</text><text x="766" y="366">SDA 2</text><text x="766" y="384">3V3 3</text><text x="766" y="402">GND 4</text></g>
  <text x="812" y="368" class="lab">G2 Grove I²C</text>
  <text x="812" y="381" class="sm">spare: SCD40, BH1750</text>

  <!-- pull-ups and test pads -->
  <rect x="640" y="324" width="26" height="12" fill="#d9c27a" stroke="#6b5a2a"/>
  <line x1="653" y1="324" x2="653" y2="336" stroke="#e6efe8" stroke-width="2"/>
  <text x="653" y="350" class="silks" text-anchor="middle">JP1 4.7 kΩ</text>
  <text x="653" y="362" class="sm" text-anchor="middle">leave open</text>
  <g fill="#d9c27a" stroke="#6b5a2a"><circle cx="572" cy="432" r="5"/><circle cx="600" cy="432" r="5"/><circle cx="628" cy="432" r="5"/><circle cx="656" cy="432" r="5"/></g>
  <g class="silks" text-anchor="middle"><text x="572" y="420">3V3</text><text x="600" y="420">GND</text><text x="628" y="420">SDA</text><text x="656" y="420">SCL</text></g>
  <text x="614" y="452" class="silks" text-anchor="middle">TP</text>

  <!-- F1 and the 5 V input -->
  <rect x="684" y="456" width="32" height="12" rx="2" fill="#e8d3a8" stroke="#8a6d3b"/>
  <text x="700" y="482" class="silks" text-anchor="middle">F1 1 A</text>
  <rect x="680" y="508" width="40" height="22" fill="#d9d4ca" stroke="#9a948a"/>
  <text x="700" y="546" class="gr" text-anchor="middle">PH 2-pin · 5 V from</text>
  <text x="700" y="558" class="gr" text-anchor="middle">Bayu Power · empty</text>

  <!-- G3 Grove D0/D1, bottom edge -->
  <rect x="540" y="502" width="72" height="28" rx="2" fill="#ffffff" stroke="#222"/>
  <g stroke="#111" stroke-width="0.8">
    <circle cx="549" cy="516" r="5" fill="#2e9e4f"/><circle cx="567" cy="516" r="5" fill="#8a4fd1"/><circle cx="585" cy="516" r="5" fill="#f28c28"/><circle cx="603" cy="516" r="5" fill="#1a1a1a"/>
  </g>
  <text x="576" y="496" class="lab" text-anchor="middle">G3 Grove D0/D1</text>
  <g class="pin">
    <text transform="translate(552 540) rotate(90)">1 D0</text>
    <text transform="translate(570 540) rotate(90)">2 D1</text>
    <text transform="translate(588 540) rotate(90)">3 3V3</text>
    <text transform="translate(606 540) rotate(90)">4 GND</text>
  </g>
  <text x="530" y="616" class="lab">→ button to GND on D0 (internal pull-up)</text>
  <text x="530" y="630" class="lab">→ WS2812B DIN on D1, 330 Ω in series</text>

  <!-- SHT40 on a Grove tail into the radiation shield -->
  <path d="M800 272 C860 272 900 268 990 268" fill="none" stroke="#333" stroke-width="3"/>
  <text x="812" y="262" class="sm">Grove cable</text>
  <g fill="#ffffff" stroke="#555" stroke-width="1.2">
    <path d="M960 222 H1100 L1090 232 H970 Z"/>
    <path d="M962 240 H1098 L1088 250 H972 Z"/>
    <path d="M962 286 H1098 L1088 296 H972 Z"/>
    <path d="M962 304 H1098 L1088 314 H972 Z"/>
  </g>
  <rect x="990" y="256" width="72" height="26" rx="3" fill="#ffffff" stroke="#222"/>
  <rect x="1018" y="262" width="14" height="14" fill="#cfd3d6" stroke="#333"/>
  <text x="1076" y="273" class="sm">SHT40</text>
  <text x="1030" y="336" class="lab" text-anchor="middle">Grove SHT40 in a radiation shield</text>
  <text x="1030" y="350" class="sm" text-anchor="middle">shade side, 60 mm or more from the stack,</text>
  <text x="1030" y="362" class="sm" text-anchor="middle">below the stack's vents</text>

  <!-- stack rule -->
  <rect x="830" y="400" width="380" height="182" rx="6" fill="#ffffff" stroke="#e0b4ae" stroke-width="1.2"/>
  <text x="846" y="424" class="hw">Socket it pins-down, header in the XIAO only</text>
  <text x="846" y="444" class="lab">The Wio clips on top of the XIAO, onto the B2B</text>
  <text x="846" y="458" class="lab">connector at the end away from USB-C. Its edge</text>
  <text x="846" y="472" class="lab">pads (J1) sit right over the XIAO's pins and carry</text>
  <text x="846" y="486" class="lab">radio lines on the D0 to D4 positions.</text>
  <text x="846" y="506" class="lab">Solder the socket header into the XIAO alone and</text>
  <text x="846" y="520" class="lab">trim the stubs flush on top before the Wio goes</text>
  <text x="846" y="534" class="lab">on. A header through both boards shorts GPIO1–5</text>
  <text x="846" y="548" class="lab">to the radio. The socket needs 25 mm clear above</text>
  <text x="846" y="562" class="lab">for the stack and the U.FL pigtail.</text>

  <!-- connection table -->
  <line x1="40" y1="652" x2="1200" y2="652" stroke="#d8d1c3"/>
  <text x="40" y="676" class="h">Where each XIAO pin lands</text>
  <g class="sm">
    <text x="40" y="698">XIAO pin</text><text x="160" y="698">GPIO</text><text x="280" y="698">net</text><text x="380" y="698">on the Core</text><text x="660" y="698">Relay use</text>
  </g>
  <line x1="40" y1="704" x2="1200" y2="704" stroke="#d8d1c3"/>
  <g class="row">
    <text x="40" y="722">3V3</text><text x="160" y="722">—</text><text x="280" y="722">3V3</text><text x="380" y="722">G1-3, G2-3, G3-3, TP</text><text x="660" y="722">supply for the SHT40 and the WS2812B</text>
    <text x="40" y="740">GND</text><text x="160" y="740">—</text><text x="280" y="740">GND</text><text x="380" y="740">G1-4, G2-4, G3-4, TP</text><text x="660" y="740">common ground</text>
    <text x="40" y="758">D4</text><text x="160" y="758">GPIO5</text><text x="280" y="758">SDA</text><text x="380" y="758">G1-2, G2-2, JP1, TP</text><text x="660" y="758">SHT40 data, 0x44</text>
    <text x="40" y="776">D5</text><text x="160" y="776">GPIO6</text><text x="280" y="776">SCL</text><text x="380" y="776">G1-1, G2-1, JP1, TP</text><text x="660" y="776">SHT40 clock</text>
    <text x="40" y="794">D0</text><text x="160" y="794">GPIO1</text><text x="280" y="794">BTN</text><text x="380" y="794">G3-1</text><text x="660" y="794">button to GND</text>
    <text x="40" y="812">D1</text><text x="160" y="812">GPIO2</text><text x="280" y="812">LED</text><text x="380" y="812">G3-2</text><text x="660" y="812">WS2812B data</text>
  </g>
  <g class="rowg">
    <text x="40" y="830">5V</text><text x="160" y="830">—</text><text x="280" y="830">VBUS</text><text x="380" y="830">F1 → 5 V rail, GH, PicoBlade, PH</text><text x="660" y="830">nothing on a Relay draws 5 V</text>
    <text x="40" y="848">D8 D9 D10</text><text x="160" y="848">7 8 9</text><text x="280" y="848">SPI</text><text x="380" y="848">no Core trace</text><text x="660" y="848">radio SPI, reaches the Wio over the B2B</text>
    <text x="40" y="866">—</text><text x="160" y="866">38 to 42</text><text x="280" y="866">radio</text><text x="380" y="866">B2B only</text><text x="660" y="866">RF switch, DIO1, busy, NSS, reset</text>
    <text x="40" y="884">D2 D3 D6 D7</text><text x="160" y="884">3 4 43 44</text><text x="280" y="884">—</text><text x="380" y="884">PicoBlade SET, VBAT divider, UART</text><text x="660" y="884">free on a Relay</text>
  </g>
<g data-stamp="bayu" font-family="Helvetica, Arial, sans-serif" font-size="13"><rect x="0" y="900" width="1240" height="52" fill="#ffffff"/><line x1="0" y1="900" x2="1240" y2="900" stroke="#c9c4b6"/><text x="20" y="922" fill="#1d2433" font-weight="bold">Bayu Relay · Bayu Core connector map, phase 1 · rev 2026-10-24</text><text x="20" y="941" fill="#5b6475">CERN-OHL-W-2.0 · Meaningful Design Group / Fab Lab Bali · github.com/Meaningful-Design-Group/makingsensebali</text></g>
</svg>
