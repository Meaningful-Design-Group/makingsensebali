<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 1240 830" xmlns="http://www.w3.org/2000/svg" role="img" font-family="ui-monospace, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', monospace">
  <title>Bayu Relay schematic</title>
  <desc>Schematic of the Bayu Relay: XIAO ESP32-S3 powered from a 5 V USB supply, SHT40 on I2C, button on D0, WS2812B on D1 through 330 ohm, and the Wio-SX1262 on GPIO 7, 8, 9 and 38 to 42 through the 30-pin board-to-board connector, with the antenna chain to an SMA bulkhead.</desc>
  <style>
    .t    { font-size: 15px; font-weight: 700; fill: #111; }
    .st   { font-size: 11px; fill: #555; }
    .pin  { font-size: 10px; fill: #111; }
    .off  { font-size: 10px; fill: #9a948a; }
    .rad  { font-size: 9.5px; fill: #b3261e; }
    .net  { font-size: 9px; fill: #555; }
    .netr { font-size: 9px; fill: #b3261e; }
    .name { font-size: 12px; font-weight: 700; fill: #111; }
    .sub  { font-size: 9.5px; fill: #555; }
    .lab  { font-size: 10.5px; fill: #222; }
    .warn { font-size: 10.5px; fill: #b3261e; }
    .sm   { font-size: 9px; fill: #555; }
    .w    { fill: none; stroke: #222; stroke-width: 1.4; }
    .wr   { fill: none; stroke: #b3261e; stroke-width: 1.6; }
    .box  { fill: #ffffff; stroke: #222; stroke-width: 1.6; }
  </style>
  <defs>
    <g id="gnd"><line x1="0" y1="0" x2="0" y2="8" stroke="#222" stroke-width="1.4"/><line x1="-8" y1="8" x2="8" y2="8" stroke="#222" stroke-width="1.6"/><line x1="-5" y1="11" x2="5" y2="11" stroke="#222" stroke-width="1.4"/><line x1="-2" y1="14" x2="2" y2="14" stroke="#222" stroke-width="1.2"/></g>
    <g id="nc"><line x1="-4" y1="-4" x2="4" y2="4" stroke="#9a948a" stroke-width="1.4"/><line x1="-4" y1="4" x2="4" y2="-4" stroke="#9a948a" stroke-width="1.4"/></g>
  </defs>

  <rect width="1240" height="830" fill="#fbf8f2"/>
  <text x="40" y="34" class="t">Bayu Relay · schematic</text>
  <text x="40" y="54" class="st">nets named · radio GPIOs drawn in red as taken · pins from variant seeed_xiao_s3_bayu and Seeed's Wio-SX1262 for XIAO V1.0 schematic</text>

  <!-- supply -->
  <rect x="140" y="172" width="150" height="36" rx="4" class="box"/>
  <text x="215" y="188" class="lab" text-anchor="middle">5 V USB wall</text>
  <text x="215" y="201" class="sm" text-anchor="middle">supply, 2 A</text>
  <path class="w" d="M290 190 H410"/>
  <text x="350" y="184" class="net" text-anchor="middle">VBUS_5V</text>
  <text x="350" y="203" class="sm" text-anchor="middle">via USB-C</text>

  <!-- 3V3 flag and ground on the left -->
  <path class="w" d="M410 215 H384"/>
  <path d="M384 208 H350 L342 215 L350 222 H384 Z" fill="#fff4e6" stroke="#f28c28" stroke-width="1.4"/>
  <text x="365" y="219" class="net" text-anchor="middle">3V3</text>
  <path class="w" d="M410 240 H396 V246"/>
  <use href="#gnd" x="396" y="246"/>

  <!-- U1 XIAO -->
  <rect x="440" y="130" width="280" height="370" rx="6" class="box"/>
  <text x="580" y="152" class="name" text-anchor="middle">U1 XIAO ESP32-S3</text>
  <text x="580" y="166" class="sub" text-anchor="middle">3V3 pin = on-board regulator output</text>
  <g class="w"><path d="M410 190 H440"/><path d="M410 215 H440"/><path d="M410 240 H440"/><path d="M414 280 H440"/><path d="M414 305 H440"/><path d="M414 330 H440"/><path d="M414 355 H440"/></g>
  <text x="448" y="194" class="pin">5V</text>
  <text x="448" y="219" class="pin">3V3</text>
  <text x="448" y="244" class="pin">GND</text>
  <text x="448" y="284" class="off">D2 · GPIO3</text>
  <text x="448" y="309" class="off">D3 · GPIO4</text>
  <text x="448" y="334" class="off">D6 · GPIO43</text>
  <text x="448" y="359" class="off">D7 · GPIO44</text>
  <use href="#nc" x="410" y="280"/><use href="#nc" x="410" y="305"/><use href="#nc" x="410" y="330"/><use href="#nc" x="410" y="355"/>
  <text x="398" y="321" class="sm" text-anchor="end">not used</text>
  <text x="398" y="333" class="sm" text-anchor="end">on a Relay</text>

  <g class="w"><path d="M720 190 H750"/><path d="M720 215 H750"/><path d="M720 300 H750"/><path d="M720 380 H750"/></g>
  <text x="712" y="194" class="pin" text-anchor="end">D4 · GPIO5</text>
  <text x="712" y="219" class="pin" text-anchor="end">D5 · GPIO6</text>
  <text x="712" y="304" class="pin" text-anchor="end">D0 · GPIO1</text>
  <text x="712" y="384" class="pin" text-anchor="end">D1 · GPIO2</text>

  <!-- WiFi antenna on the XIAO -->
  <path class="w" d="M690 130 V104"/>
  <path d="M680 92 L690 104 L700 92" fill="none" stroke="#222" stroke-width="1.4"/>
  <line x1="690" y1="92" x2="690" y2="104" stroke="#222" stroke-width="1.4"/>
  <text x="706" y="104" class="sm">WiFi 2.4 GHz, XIAO U.FL</text>

  <!-- radio lines, bottom of U1 -->
  <g class="rad">
    <text transform="translate(473 492) rotate(-90)">D8·GPIO7 SCK</text>
    <text transform="translate(503 492) rotate(-90)">D9·GPIO8 MISO</text>
    <text transform="translate(533 492) rotate(-90)">D10·GPIO9 MOSI</text>
    <text transform="translate(563 492) rotate(-90)">GPIO41 NSS</text>
    <text transform="translate(593 492) rotate(-90)">GPIO42 RST</text>
    <text transform="translate(623 492) rotate(-90)">GPIO40 BUSY</text>
    <text transform="translate(653 492) rotate(-90)">GPIO39 DIO1</text>
    <text transform="translate(683 492) rotate(-90)">GPIO38 RF SW</text>
  </g>
  <g class="wr">
    <path d="M470 500 V610"/><path d="M500 500 V610"/><path d="M530 500 V610"/><path d="M560 500 V610"/>
    <path d="M590 500 V610"/><path d="M620 500 V610"/><path d="M650 500 V610"/><path d="M680 500 V610"/>
  </g>
  <!-- J3 board-to-board connector -->
  <rect x="456" y="516" width="238" height="12" fill="#555"/>
  <text x="704" y="526" class="lab">J3 · B2B 30-pin</text>
  <text x="704" y="539" class="sm">also carries 3V3, GND, VIN,</text>
  <text x="704" y="551" class="sm">GPIO21 and GPIO48</text>
  <g class="netr">
    <text transform="translate(482 598) rotate(-90)">LORA_SCK</text>
    <text transform="translate(512 598) rotate(-90)">LORA_MISO</text>
    <text transform="translate(542 598) rotate(-90)">LORA_MOSI</text>
    <text transform="translate(572 598) rotate(-90)">LORA_NSS</text>
    <text transform="translate(602 598) rotate(-90)">LORA_RST</text>
    <text transform="translate(632 598) rotate(-90)">LORA_BUSY</text>
    <text transform="translate(662 598) rotate(-90)">LORA_DIO1</text>
    <text transform="translate(692 598) rotate(-90)">RF_SW1</text>
  </g>
  <text x="430" y="520" class="warn" text-anchor="end">taken by the radio,</text>
  <text x="430" y="534" class="warn" text-anchor="end">never reuse these</text>
  <text x="430" y="548" class="sm" text-anchor="end">D8 to D10 are the same</text>
  <text x="430" y="560" class="sm" text-anchor="end">nets as GPIO7 to 9</text>

  <!-- U2 Wio-SX1262 -->
  <rect x="440" y="610" width="280" height="112" rx="6" class="box"/>
  <g class="pin">
    <text transform="translate(473 620) rotate(-90)" text-anchor="end">SCK</text>
    <text transform="translate(503 620) rotate(-90)" text-anchor="end">MISO</text>
    <text transform="translate(533 620) rotate(-90)" text-anchor="end">MOSI</text>
    <text transform="translate(563 620) rotate(-90)" text-anchor="end">NSS</text>
    <text transform="translate(593 620) rotate(-90)" text-anchor="end">RST</text>
    <text transform="translate(623 620) rotate(-90)" text-anchor="end">BUSY</text>
    <text transform="translate(653 620) rotate(-90)" text-anchor="end">DIO1</text>
    <text transform="translate(683 620) rotate(-90)" text-anchor="end">RF_SW1</text>
  </g>
  <text x="580" y="680" class="name" text-anchor="middle">U2 Wio-SX1262 for XIAO</text>
  <text x="580" y="695" class="sub" text-anchor="middle">SX1262 · 862–930 MHz · up to +22 dBm</text>
  <text x="580" y="709" class="sub" text-anchor="middle">DIO2 = RF switch · DIO3 = TCXO 1.8 V</text>
  <g class="w"><path d="M410 645 H440"/><path d="M410 670 H440"/></g>
  <text x="448" y="649" class="pin">3V3</text>
  <text x="448" y="674" class="pin">GND</text>
  <path d="M410 638 H376 L368 645 L376 652 H410 Z" fill="#fff4e6" stroke="#f28c28" stroke-width="1.4"/>
  <text x="391" y="649" class="net" text-anchor="middle">3V3</text>
  <path class="w" d="M410 670 H400 V676"/>
  <use href="#gnd" x="400" y="676"/>

  <!-- antenna chain -->
  <path class="w" d="M720 666 H756"/>
  <text x="712" y="670" class="pin" text-anchor="end">ANT</text>
  <circle cx="762" cy="666" r="6" fill="#d9c27a" stroke="#333"/>
  <path d="M768 666 C800 666 820 666 860 666" fill="none" stroke="#333" stroke-width="2.4"/>
  <rect x="860" y="658" width="30" height="16" fill="#c9a640" stroke="#6b5a2a"/>
  <path class="w" d="M890 666 H910 V614"/>
  <path d="M898 598 L910 614 L922 598" fill="none" stroke="#222" stroke-width="1.4"/>
  <line x1="910" y1="598" x2="910" y2="614" stroke="#222" stroke-width="1.4"/>
  <text x="762" y="692" class="sm" text-anchor="middle">U.FL</text>
  <text x="812" y="656" class="net" text-anchor="middle">RF_ANT</text>
  <text x="812" y="692" class="sm" text-anchor="middle">pigtail</text>
  <text x="875" y="692" class="sm" text-anchor="middle">SMA-F</text>
  <text x="875" y="704" class="sm" text-anchor="middle">bulkhead</text>
  <text x="930" y="606" class="lab">whip, 915 MHz band</text>
  <text x="930" y="620" class="sm">vertical, above the roofline</text>

  <!-- I2C to SHT40 -->
  <path class="w" d="M750 190 H880"/><path class="w" d="M750 215 H880"/>
  <text x="815" y="184" class="net" text-anchor="middle">I2C_SDA</text>
  <text x="815" y="209" class="net" text-anchor="middle">I2C_SCL</text>
  <rect x="880" y="170" width="160" height="104" rx="6" class="box"/>
  <text x="888" y="194" class="pin">SDA</text>
  <text x="888" y="219" class="pin">SCL</text>
  <text x="888" y="244" class="pin">VDD</text>
  <text x="888" y="264" class="pin">GND</text>
  <text x="990" y="194" class="name" text-anchor="middle">U3 SHT40</text>
  <text x="990" y="210" class="sub" text-anchor="middle">I²C 0x44</text>
  <text x="990" y="224" class="sub" text-anchor="middle">1.08–3.6 V</text>
  <text x="990" y="238" class="sub" text-anchor="middle">10 kΩ pull-ups</text>
  <text x="990" y="250" class="sub" text-anchor="middle">on the breakout</text>
  <path class="w" d="M880 240 H860"/>
  <path d="M860 233 H826 L818 240 L826 247 H860 Z" fill="#fff4e6" stroke="#f28c28" stroke-width="1.4"/>
  <text x="841" y="244" class="net" text-anchor="middle">3V3</text>
  <path class="w" d="M880 260 H864 V266"/>
  <use href="#gnd" x="864" y="266"/>

  <!-- button -->
  <path class="w" d="M750 300 H900"/>
  <text x="815" y="294" class="net" text-anchor="middle">BTN</text>
  <circle cx="900" cy="300" r="2.5" fill="#222"/>
  <circle cx="940" cy="300" r="2.5" fill="#222"/>
  <path class="w" d="M902 290 L938 282"/>
  <path class="w" d="M920 286 V278 M914 278 H926"/>
  <path class="w" d="M940 300 H960 V306"/>
  <use href="#gnd" x="960" y="306"/>
  <text x="920" y="332" class="lab" text-anchor="middle">S1 button</text>
  <text x="920" y="345" class="sm" text-anchor="middle">internal pull-up on GPIO1</text>

  <!-- LED -->
  <path class="w" d="M750 380 H800"/>
  <path d="M800 380 l4 -6 l8 12 l8 -12 l8 12 l8 -12 l8 12 l4 -6" fill="none" stroke="#222" stroke-width="1.4"/>
  <path class="w" d="M848 380 H900"/>
  <text x="824" y="366" class="net" text-anchor="middle">R1 330 Ω</text>
  <text x="775" y="374" class="net" text-anchor="middle">LED</text>
  <text x="874" y="374" class="net" text-anchor="middle">LED_DIN</text>
  <rect x="900" y="362" width="150" height="80" rx="6" class="box"/>
  <text x="908" y="384" class="pin">DIN</text>
  <text x="908" y="409" class="pin">VDD</text>
  <text x="908" y="429" class="pin">GND</text>
  <text x="1000" y="388" class="name" text-anchor="middle">U4 WS2812B</text>
  <text x="1000" y="404" class="sub" text-anchor="middle">status LED</text>
  <text x="1000" y="418" class="sub" text-anchor="middle">on 3V3, see note</text>
  <path class="w" d="M900 405 H880"/>
  <path d="M880 398 H846 L838 405 L846 412 H880 Z" fill="#fff4e6" stroke="#f28c28" stroke-width="1.4"/>
  <text x="861" y="409" class="net" text-anchor="middle">3V3</text>
  <path class="w" d="M900 425 H884 V431"/>
  <use href="#gnd" x="884" y="431"/>

  <!-- notes -->
  <line x1="40" y1="752" x2="1200" y2="752" stroke="#d8d1c3"/>
  <text x="40" y="772" class="sm">The Wio board also has its own button K1 on GPIO21 (10 kΩ pull-up) and a green LED on GPIO48 (330 Ω), both through J3. GPIO48 is LED_POWER in the variant; GPIO21 is not read by the Bayu build.</text>
  <text x="40" y="788" class="sm">The Wio's two 1×7 edge-pad rows repeat the radio lines on the D0 to D4 positions (DIO1, BUSY, RST, NSS, RF_SW1). Never put a header through both boards.</text>
  <text x="40" y="804" class="sm">WS2812B: datasheet supply 3.5 to 5.3 V, data high above 0.7 × VDD. On 3V3 one pixel lights and reads the 3.3 V GPIO cleanly; on 5 V the data line would need a level shifter.</text>
</svg>
