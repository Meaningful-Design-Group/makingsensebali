<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="900" viewBox="0 0 1100 900" font-family="Helvetica, Arial, sans-serif">
<rect width="1100" height="900" fill="#fbfaf6"/>
<text x="30" y="44" font-size="24" fill="#1d2433" font-weight="bold" text-anchor="start">5 V on two Grove sockets of the XIAO boards Seeed already makes</text>
<text x="30" y="70" font-size="14" fill="#5b6475" font-weight="normal" text-anchor="start">One solder jumper per socket, set to 3V3 out of the box. Highlighted: the sockets that get it.</text>
<text x="40" y="120" font-size="17" fill="#1d2433" font-weight="bold" text-anchor="start">Grove Shield for XIAO</text>
<rect x="40" y="135" width="300" height="200" rx="14" fill="#1f2b45"/>
<rect x="350" y="135" width="150" height="200" rx="14" fill="#1f2b45"/>
<rect x="60" y="175" width="120" height="120" rx="8" fill="#e9ecf2" stroke="#9aa3b5"/>
<text x="120" y="240" font-size="14" fill="#1d2433" font-weight="bold" text-anchor="middle">XIAO</text>
