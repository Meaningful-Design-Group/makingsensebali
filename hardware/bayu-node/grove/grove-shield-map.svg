<text x="572" y="778" font-size="14" fill="#1d2433" font-weight="normal" text-anchor="start" >PMS5003 data</text>
<text x="747" y="778" font-size="14" fill="#1d2433" font-weight="normal" text-anchor="start" >PMS5003 SET</text>
<rect x="891" y="750" width="113" height="46" rx="6" fill="#fbeed6"/>
<text x="897" y="778" font-size="14" fill="#9a5b00" font-weight="normal" text-anchor="start" >PMS5003 fan</text>
<rect x="1018" y="752" width="134" height="42" rx="8" fill="#fbeed6"/>
<text x="1085.0" y="778" font-size="14" fill="#9a5b00" font-weight="bold" text-anchor="middle" >one 5V wire</text>
<rect x="40" y="810" width="1120" height="74" fill="#ffffff"/>
<text x="52" y="853" font-size="17" fill="#1d2433" font-weight="bold" text-anchor="start" >Relay</text>
<text x="222" y="852" font-size="14" fill="#1d2433" font-weight="normal" text-anchor="start" >Grove SHT40</text>
