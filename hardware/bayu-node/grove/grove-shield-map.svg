<text x="52" y="779" font-size="17" fill="#1d2433" font-weight="bold" text-anchor="start" >Indoor</text>
<text x="222" y="778" font-size="14" fill="#1d2433" font-weight="normal" text-anchor="start" >Grove SCD41</text>
