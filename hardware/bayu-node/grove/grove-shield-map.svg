<rect x="800" y="118" width="360" height="282" rx="12" fill="#ffffff" stroke="#c9c4b6"/>
<text x="818" y="150" font-size="16" fill="#1d2433" font-weight="bold" text-anchor="start" >Reading the shield</text>
<text x="818" y="178" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start" >Pin 1 is the yellow wire of a Grove cable.</text>
<text x="818" y="198" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start" >The left half keeps the XIAO and four sockets:</text>
<text x="818" y="218" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start" >D0, D1, I2C and UART. The right half snaps off.</text>
<text x="818" y="238" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start" ></text>
<text x="818" y="258" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start" >Dashed purple: lost when the Wio-SX1262 is</text>
<text x="818" y="278" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start" >fitted. D8 to D10 are the radio's SPI bus.</text>
<text x="818" y="298" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start" ></text>
<text x="818" y="318" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start" >Sockets give 3V3 only. Anything that needs</text>
<text x="818" y="338" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start" >5 V, like a PMS5003 fan, takes a wire from</text>
<text x="818" y="358" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start" >the 5V header pin. That is the one thing that</text>
<text x="818" y="378" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start" >stops a variant being plug and play.</text>
<rect x="40" y="470" width="1120" height="44" rx="8" fill="#1d2433"/>
<text x="52" y="498" font-size="14" fill="#ffffff" font-weight="bold" text-anchor="start" >Variant</text>
