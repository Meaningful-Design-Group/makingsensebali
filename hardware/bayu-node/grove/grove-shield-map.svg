<text x="897" y="852" font-size="14" fill="#5b6475" font-weight="normal" text-anchor="start" >—</text>
<rect x="1018" y="826" width="134" height="42" rx="8" fill="#e3f2e9"/>
<text x="1085.0" y="852" font-size="14" fill="#1f7a4d" font-weight="bold" text-anchor="middle" >plug and play</text>
<rect x="40" y="470" width="1120" height="414" rx="8" fill="none" stroke="#c9c4b6"/>
<text x="40" y="918" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start" >The PMS5003 has no Grove version. Its data goes in the UART socket and SET in the D2 socket, through a Grove to</text>
<text x="40" y="940" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start" >1.25 mm 8-pin cable, and its fan takes 5 V from the header. Leave SET out and the fan simply runs all the time.</text>
<text x="40" y="962" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start" >* Seeed fitted the Grove SEN54 with a regulator for 3.3 V supply, according to one review. Not confirmed on our bench yet.</text>
<text x="40" y="984" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start" >The Grove HM3301 is rated 3.3 or 5 V by Seeed, and the deployed nodes run it on the socket's 3V3.</text>
<text x="40" y="1006" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start" >The D0 and D1 sockets take the Grove button and LED. With LoRa fitted, the D8 and D9 sockets are not usable.</text>
</svg>