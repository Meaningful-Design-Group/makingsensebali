<polyline points="190,1022 760,1022 760,1032 875,1032" fill="none" stroke="#4cae4f" stroke-width="3.5" stroke-linejoin="round"/>
<circle cx="190" cy="1022" r="4" fill="#4cae4f" stroke="#ffffff" stroke-width="1"/>
<circle cx="875" cy="1032" r="4" fill="#4cae4f" stroke="#ffffff" stroke-width="1"/>
<text x="72" y="1061" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start">yellow, D7 RX</text>
<polyline points="190,1056 780,1056 780,1058 875,1058" fill="none" stroke="#1b6b3a" stroke-width="3.5" stroke-linejoin="round"/>
<circle cx="190" cy="1056" r="4" fill="#1b6b3a" stroke="#ffffff" stroke-width="1"/>
<circle cx="875" cy="1058" r="4" fill="#1b6b3a" stroke="#ffffff" stroke-width="1"/>
<text x="975" y="1198" font-size="12" fill="#5b6475" font-weight="normal" text-anchor="middle">SET, RESET, 7 and 8 stay open</text>
<text x="560" y="1090" font-size="13" fill="#5b6475" font-weight="normal" text-anchor="middle">White D6 goes to RXD and yellow D7 to TXD, 3.3 V logic both ways.</text>
<text x="30" y="1250" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start">Set and check the module before a sensor goes on it. Power the lead from a Grove socket with nothing on the output and measure</text>
<text x="30" y="1274" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start">OUT+ to OUT−. A fixed buck-boost should read 5.0 V. An MT3608 comes set to anything: turn its trimmer to 5.0 V, then seal it with a drop of glue.</text>
<text x="30" y="1298" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start">On most of these modules IN− and OUT− are the same ground. Check it with a multimeter before relying on it.</text>
<text x="30" y="1322" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start">Heat-shrink the module inside the lead. The Grove side stays a plain Grove plug, so the lead goes into any Grove socket or hub port.</text>
<text x="30" y="1346" font-size="13" fill="#1d2433" font-weight="normal" text-anchor="start">Everything now runs from the XIAO's 3V3 regulator. See the current budget on the build page before deploying three PM sensors this way.</text>
