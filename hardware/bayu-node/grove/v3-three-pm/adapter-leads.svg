<text x="30" y="44" font-size="24" fill="#1d2433" font-weight="bold" text-anchor="start">Bayu v3 with three PM sensors · Plug-in version with adapter leads</text>
<text x="30" y="70" font-size="14" fill="#5b6475" font-weight="normal" text-anchor="start">Every sensor goes into a Grove socket. A small module on each lead turns the socket's 3V3 into 5 V.</text>
<text x="30" y="94" font-size="14" fill="#1d2433" font-weight="normal" text-anchor="start">Grey bands are Grove cables. On the leads, every wire is drawn in its net colour, with the Grove wire colour named.</text>
